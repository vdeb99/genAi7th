services:
  qdrant:
    image: qdrant/qdrant:v1.14.1
    container_name: qdrant_db
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [rag-network]

  neo4j:
    image: neo4j:5.12.0
    container_name: neo4j_db
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - ./neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_AUTH%%/*} -p $${NEO4J_AUTH#*/} 'RETURN 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 15
    networks: [rag-network]

  backend:
    build: ./backend
    container_name: backend_api
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      QDRANT_COLLECTION: multimodal_collection_v3
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      qdrant: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [rag-network]

  frontend:
    build: ./frontend
    container_name: frontend_ui
    ports:
      - "3000:80"
    depends_on:
      backend: { condition: service_healthy }
    networks: [rag-network]

networks:
  rag-network:
    driver: bridge
